[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoharness"
version = "0.1.0"
description = "A self-evolving runtime harness (Belief / Progress / Experience) for long-horizon LLM agents on ALFWorld, WebShop and WebArena"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "openai>=1.30", "pyyaml>=6.0", "requests>=2.31"]

[project.optional-dependencies]
alfworld = ["alfworld>=0.3.5"]
webshop = ["gym==0.24.0"]
# GRPO: see requirements-train.txt / requirements-agentgym.txt and training/ (README, "GRPO training").
train = ["hydra-core>=1.3", "ray>=2.30", "pandas>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["evoharness*"]

[tool.setuptools.package-data]
"evoharness.envs.alfworld" = ["config_tw.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
