data:
  tokenizer: null
  train_file: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  prompt_key: item_id
  max_prompt_length: 2048 # Maximum length of the general task description prompt in the first turn.
  max_response_length: 2048 # Maximum total token length of the interaction trajectory (excluding the task prompt).
  train_batch_size: 1024
  val_batch_size: null
  # ---- periodic held-out eval (agentgym env-based) ----
  eval_path: null           # abs dir containing <eval_task_name>_test.json + category files
  eval_task_name: null      # e.g. webarena; if null, falls back to agentgym.task_name
  eval_batch_size: 32
  eval_n_samples: 1         # rollouts per eval task (1 = greedy Avg@1)
  eval_max_rounds: null     # fixed interaction horizon for val; null = follow the training horizon
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: True
  shuffle: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
  ref:
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  agentgym:
      task_name: textcraft # Training task name of AgentGym.
      env_addr: 'http://localhost:5000' # URL of the AgentGym environment server.
      max_retries: 10 # Maximum retry times.
      max_rounds: 10 # Maximum token length of a single response per turn.
      timeout: 300 # timeout seconds.
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: 32768
    max_num_seqs: 1024
    max_tokens: 1024
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    send_interval: 1 # # interval when sending request
    rollout_log_dir: null # Directory for storing rollout trajectories.

critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp # [fsdp, fsdp2]
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
      fsdp_size: -1
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: null # set a number
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward_manager: null
  launch_reward_fn_async: False # custom reward function executed async on CPU, during log_prob
  sandbox_fusion:
    url: null # faas url to run code in cloud sandbox
    max_concurrent: 64 # max concurrent requests to sandbox
custom_reward_function:
  path: null
  name: null

# --- WebArena shaped GRPO + harness / consolidation (path B) ---
reward_shaping:
  enable: False              # master switch; when false the trainer stays sparse
  # ALFWorld/WebShop values divided by 10: their success reward is 10 while
  # WebArena's judge returns 0/1, so this keeps each shaping term at ~10% of a
  # success. GRPO normalizes within the group, so only the ratio matters.
  lambda_eff: 0.02
  lambda_div: 0.02            # max weight; cosine-annealed to 0 over training
  div_reward: verb_ratio      # or bpe_coverage: |{commit, track, recall, note} used| / 4
  lambda_spam: 0.01
  spam_cap: 10
  lambda_invalid: 0.01

harness:
  enable: False              # intercept commit/recall/track/note in the rollout
  prompt_variant: paced      # must match SFT (paced) for on-policy correctness
  recall_top_k: 3
  # Per-frame observation cap, matching SFT/eval. 0 disables. Observations are
  # ~97% of a long episode's context, so this -- not the round budget -- is the
  # lever on ctx overflow. Applied to both arms so sparse stays comparable.
  max_obs_chars: 12000
  bank_path: null            # base bank (offline-induced, e.g. .../empty_base_skills.json)
  bank_dir: null             # per-rank delta + snapshot dir (driver writes shared.json)
  bank_snapshot: null        # current canonical snapshot (driver updates each batch)
  # --- structured experience consolidation (epoch boundaries, driver-side) ---
  # When evolve=True the rollout keeps the bank read-only and only buffers
  # evidence; the driver reflects/reconciles it into the bank at epoch end.
  evolve: False
  reflector_model: null      # required when evolve=True (any OpenAI-compatible model name)
  reconciler_model: null     # defaults to reflector_model
  skill_reconcile: True      # False = rule-based apply of the reflector findings only
  delete_veto_value: 3       # refuse deletes of skills whose evidence exceeds this
  skill_min_evidence: 3
  # Stratified per-epoch reflection budget: every task_type contributes this many
  # successes AND this many failures, so failures (the majority of episodes) are
  # not crowded out. evolve_max_episodes only trims depth, never task_types.
  evolve_per_type_success: 2
  evolve_per_type_fail: 2
  evolve_max_episodes: 48
  # Post-evolve housekeeping (decay -> merge_similar -> prune -> cap). Without it
  # the LLM CRUD path grows the bank without bound and inflates every recall.
  bank_cap_per_category: 80
  bank_max_field_chars: 300  # clamp principle / when_to_apply / ... prose

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  kl_penalty: kl  # how to estimate kl divergence
  # Drop groups whose siblings all got the same task reward. Their score spread
  # is pure reward shaping, and GRPO's division by the group std renormalises it
  # into a full-size advantage -- see core_algos.uniform_signal_group_mask.
  skip_uniform_groups: False
  rounds_ctrl:
    type: fixed  # Strategy for controlling the maximum number of interaction turns
    rounds: 15  # Maximum number of allowed interaction turns.
    steps_scaling_inter: 100  # Frequency (in training steps) to increase the maximum number of turns when using `scaling_inter_stepwise`.
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

trainer:
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: auto # or auto or resume_path if 
  resume_from_path: False
  test_freq: -1
  eval_freq: 0              # >0: run held-out env eval every N steps (0=disabled)
  val_before_train: False  # run one eval at step 0 (baseline) before training
  critic_warmup: 0
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: False
  del_local_ckpt_after_load: False
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  storage_mode: local
